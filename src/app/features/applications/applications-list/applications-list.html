<div class="list-container">
  <div class="header">
    <h2>Jelentkezéseim</h2>
    <button mat-raised-button color="primary" routerLink="/applications/new">+ Új jelentkezés</button>
  </div>

  <table mat-table [dataSource]="applications" class="mat-elevation-z8">
    <!-- Cég oszlop -->
    <ng-container matColumnDef="companyName">
      <th mat-header-cell *matHeaderCellDef> Cég </th>
      <td mat-cell *matCellDef="let app"> {{app.companyName}} </td>
    </ng-container>

    <!-- Pozíció oszlop -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> Pozíció </th>
      <td mat-cell *matCellDef="let app"> {{app.position}} </td>
    </ng-container>

    <!-- Státusz oszlop -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Státusz </th>
      <td mat-cell *matCellDef="let app"> {{app.status}} </td>
    </ng-container>

    <!-- Dátum oszlop -->
    <ng-container matColumnDef="appliedAt">
      <th mat-header-cell *matHeaderCellDef> Dátum </th>
      <td mat-cell *matCellDef="let app"> {{app.appliedAt | date:'yyyy-MM-dd'}} </td>
    </ng-container>

    <!-- Műveletek oszlop -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Műveletek </th>
      <td mat-cell *matCellDef="let app">
        <button mat-icon-button color="primary" [routerLink]="['/applications', app.id, 'edit']">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteApplication(app.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
