<div class="list-container">
  <div class="header">
    <h2>Jelentkezéseim</h2>
    <mat-toolbar color="primary">
      <span class="spacer"></span>
      <button mat-button color="accent" routerLink="/applications/new">+ Új jelentkezés</button>
      <button mat-button (click)="logOut()">Kijelentkezés</button>
    </mat-toolbar>
  </div>

  <div class="table-responsive">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

      <ng-container matColumnDef="companyName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cég</th>
        <td mat-cell *matCellDef="let app">{{ app.companyName }}</td>
      </ng-container>

      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Pozíció</th>
        <td mat-cell *matCellDef="let app">{{ app.position }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Státusz</th>
        <td mat-cell *matCellDef="let app">
          <mat-select [value]="app.status" (selectionChange)="patchStatus(app.id, $event.value)">
            @for (opt of statusOptions; track opt.value) {
              <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
            }
          </mat-select>
        </td>
      </ng-container>

      <ng-container matColumnDef="appliedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Dátum</th>
        <td mat-cell *matCellDef="let app">{{ app.appliedAt | date:'yyyy-MM-dd' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Műveletek</th>
        <td mat-cell *matCellDef="let app">
          <button mat-icon-button color="primary" (click)="openDetailDialog(app)">
            <mat-icon>info</mat-icon>
          </button>
          <button mat-icon-button color="primary" [routerLink]="['/applications', app.id, 'edit']">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteApplication(app.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
