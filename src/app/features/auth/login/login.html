<div class="login-container">
  <mat-card>
    <mat-card-title>Bejelentkezés</mat-card-title>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email mező -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email cím</mat-label>
          <input matInput formControlName="email" type="email" placeholder="pelda@email.hu">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Az email cím megadása kötelező.
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Kérlek érvényes email címet adj meg.
          </mat-error>
        </mat-form-field>

        <!-- Jelszó mező -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Jelszó</mat-label>
          <input matInput formControlName="password" type="password" placeholder="******">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            A jelszó megadása kötelező.
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            A jelszónak legalább 6 karakter hosszúnak kell lennie.
          </mat-error>
        </mat-form-field>

        <!-- Általános hibaüzenet (backendről) -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="submit-btn">
          Bejelentkezés
        </button>
      </form>

      <div class="divider">vagy</div>

      <button mat-stroked-button class="google-btn" type="button" (click)="onGoogleLogin()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20">
        Bejelentkezés Google-lel
      </button>

    </mat-card-content>
    <mat-card-actions>
      <a routerLink="/register">Még nincs fiókod? Regisztrálj!</a>
    </mat-card-actions>
  </mat-card>
</div>
