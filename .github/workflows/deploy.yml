name: Auto Deploy Frontend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug list files after checkout
        run: |
          pwd
          ls -la

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image (no cache)
        run: |
          docker build --no-cache -t adamtuska/jobtracker-frontend:latest .
          docker push adamtuska/jobtracker-frontend:latest

      - name: Deploy on self-hosted runner
        run: |
          cd /mnt/Kulso_HDD/github/actions-runner-frontend/_work/job-tracker/job-tracker
          echo "=== Contents of directory: ==="
          ls -la
          echo "=== Running docker compose ==="
          docker compose pull frontend
          docker compose up -d frontend